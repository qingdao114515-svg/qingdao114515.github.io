<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xorist｜个人主页</title>
<meta name="description" content="Xorist 的个人主页">
<meta name="theme-color" content="#f0f7f2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
:root {
  --bg1: #f0f7f2;
  --bg2: #dceee2;
  --card: rgba(255,255,255,.72);
  --border: rgba(0,0,0,.07);
  --text: #1e3a2f;
  --muted: #4a6b5c;
  --accent: #2d8a5e;
  --ring: #3da06e;
  --deco: rgba(45,138,94,.45);
}
[data-theme="dark"] {
  --bg1: #0c1410;
  --bg2: #132018;
  --card: rgba(20,32,26,.65);
  --border: rgba(255,255,255,.08);
  --text: #d4e8dc;
  --muted: #8aab96;
  --accent: #5ecf8a;
  --ring: #7de0a8;
  --deco: rgba(94,207,138,.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: radial-gradient(120% 90% at 50% 0%, var(--bg2), transparent 60%), var(--bg1);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 64px 16px 28px;
  transition: background .4s ease, color .4s ease;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(45% 40% at 15% 16%, rgba(90,180,120,.18), transparent 70%),
    radial-gradient(50% 46% at 86% 22%, rgba(80,160,140,.12), transparent 72%),
    radial-gradient(55% 52% at 74% 86%, rgba(120,190,150,.14), transparent 72%);
}
[data-theme="dark"] body::before {
  background:
    radial-gradient(42% 32% at 18% 22%, rgba(40,120,80,.18), transparent 70%),
    radial-gradient(46% 36% at 82% 28%, rgba(30,90,70,.14), transparent 72%),
    radial-gradient(52% 42% at 70% 84%, rgba(60,150,100,.12), transparent 72%);
}
.wrap {
  width: 100%;
  max-width: 400px;
  text-align: center;
}
.ava-stage {
  position: relative;
  width: clamp(120px, 16vh, 150px);
  height: clamp(120px, 16vh, 150px);
  margin: 8px auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ava-stage::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent, var(--accent), transparent 55%, var(--accent), transparent);
  filter: blur(9px);
  opacity: .55;
  animation: spin 8s linear infinite reverse;
}
.petal {
  position: fixed;
  top: -20px;
  z-index: 1;
  pointer-events: none;
  opacity: 0.7;
  animation: fall linear infinite;
}
.petal svg {
  width: 18px;
  height: 18px;
  fill: var(--accent);
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.1));
}
@keyframes fall {
  0% {
    transform: translateY(-10vh) rotate(0deg) translateX(0);
    opacity: 0.9;
  }
  100% {
    transform: translateY(110vh) rotate(360deg) translateX(40px);
    opacity: 0.4;
  }
}
.avatar {
  position: relative;
  z-index: 2;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--card);
  box-shadow: 0 8px 26px rgba(0,0,0,.18), 0 0 0 1px var(--border), 0 0 22px var(--accent);
  background: linear-gradient(135deg, var(--accent), #8a6a28);
}
.name {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .5px;
  margin: 4px 0 6px;
}
.name .star { color: var(--accent); margin: 0 8px; font-weight: 400; }
.handle {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 10px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  margin: 10px 0 12px;
}
.tag {
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  color: var(--accent);
  background: var(--card);
  border: 1px solid var(--border);
}
.bio {
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--muted);
  margin: 6px auto 20px;
  max-width: 340px;
}
.links {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-decoration: none;
  color: var(--text);
  backdrop-filter: blur(8px);
  transition: transform .15s ease, box-shadow .15s ease;
}
.link:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(0,0,0,.08);
}
.link .left { text-align: left; }
.link .title { font-weight: 600; font-size: 14.5px; }
.link .desc { font-size: 12px; color: var(--muted); margin-top: 1px; }
.link .arrow { color: var(--accent); font-size: 18px; opacity: .8; }
.theme-btn {
  position: fixed;
  top: 14px;
  right: 14px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
footer {
  margin-top: 26px;
  font-size: 11.5px;
  color: var(--muted);
  opacity: .8;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 480px) {
  body { padding-top: 56px; }
  .name { font-size: 23px; }
}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" aria-label="切换深浅色">🌙</button>

<div class="wrap">
  <div class="ava-stage">
    <!-- 可换成你自己的头像 -->
    <img class="avatar" src="https://api.dicebear.com/7.x/adventurer-neutral/svg?seed=Xorist&backgroundColor=2d8a5e" alt="Xorist">
  </div>

  <h1 class="name"><span class="star">✦</span>Xorist<span class="star">✦</span></h1>
  <div class="handle">@qingdao114515</div>

  <div class="tags">
    <span class="tag">全栈工程师</span>
    <span class="tag">开源爱好者</span>
    <span class="tag">终身学习者</span>
  </div>

  <p class="bio">欢迎来到我的主页。喜欢做实用的工具与分享想法。</p>

  <div class="links">
    <a class="link" href="https://x.com/qingdao114515" target="_blank" rel="noopener">
      <div class="left">
        <div class="title">X · @qingdao114515</div>
        <div class="desc">日常动态与想法</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="link" href="https://github.com/" target="_blank" rel="noopener">
      <div class="left">
        <div class="title">GitHub · 开源项目</div>
        <div class="desc">代码与工具</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="link" href="mailto:">
      <div class="left">
        <div class="title">邮箱 · 联系我</div>
        <div class="desc">合作与交流</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <footer>© 2026 Xorist</footer>
</div>

<div id="petals"></div>

<script>
(function() {
  const btn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const meta = document.querySelector('meta[name="theme-color"]');
  const saved = localStorage.getItem('qy-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');

  function apply(t) {
    root.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0c1410' : '#f0f7f2');
    localStorage.setItem('qy-theme', t);
  }
  apply(theme);

  btn.onclick = () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
  };

  // 满屏飘落花瓣
  const container = document.getElementById('petals');
  const petalSVG = `<svg viewBox="0 0 24 24"><path d="M12 2c-1.5 4-4 6.5-7 8 3 1.5 5.5 4 7 8 1.5-4 4-6.5 7-8-3-1.5-5.5-4-7-8z"/></svg>`;
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.innerHTML = petalSVG;
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = (-Math.random() * 12) + 's';
    p.style.transform = `scale(${0.6 + Math.random() * 0.8})`;
    p.style.opacity = (0.45 + Math.random() * 0.45).toFixed(2);
    container.appendChild(p);
  }
})();
</script>
</body>
</html>
